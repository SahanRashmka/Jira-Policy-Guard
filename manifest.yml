modules:
  jira:projectSettingsPage:
    - key: policy-guard-project-settings
      resource: policy-guard-ui
      resolver:
        function: resolver
      title: Jira Policy Guard
  function:
    - key: resolver
      handler: src/presentation/resolvers/index.handler

resources:
  - key: policy-guard-ui
    path: static/policy-guard-ui/dist

permissions:
  scopes:
    - storage:app
    - read:jira-work

app:
  id: ari:cloud:ecosystem::app/6d7d8d99-7f86-4299-ace2-4d34d7ccc83e
  runtime:
    name: nodejs22.x
